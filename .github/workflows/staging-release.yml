name: Staging release

on:
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: HTTPS URL of the isolated staging Worker custom domain.
        required: true
        type: string
      restore_fixture_game_id:
        description: Existing non-sensitive staging game ID used to prove backup restore.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-staging:
    name: Release staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: monopoly-bank-staging-release
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_STAGING_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_STAGING_D1_DATABASE_NAME }}
      CLOUDFLARE_STAGING_WORKER_NAME: ${{ vars.CLOUDFLARE_STAGING_WORKER_NAME || 'monopoly-bank-staging' }}
      SMOKE_BASE_URL: ${{ inputs.staging_base_url }}
      D1_RESTORE_EXPECTED_GAME_ID: ${{ inputs.restore_fixture_game_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release configuration
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_STAGING_D1_DATABASE_NAME:-}"

      - name: Install dependencies
        run: npm ci

      - name: Quality and migration checks
        run: |
          npm run lint
          npm test
          npm run test:d1
          npm run build

      - name: Resolve isolated staging D1 database
        run: |
          database_id="$(npx wrangler d1 info "$CLOUDFLARE_STAGING_D1_DATABASE_NAME" --json | jq -er '.. | objects | .uuid? // empty' | head -n 1)"
          test -n "$database_id"
          echo "CLOUDFLARE_STAGING_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"

      - name: Prepare and validate staging Worker bindings
        run: |
          node scripts/prepare-staging-deploy.mjs
          WRANGLER_CONFIG_PATH=dist/monopoly_bank/wrangler.staging.json EXPECTED_D1_DATABASE_ID="$CLOUDFLARE_STAGING_D1_DATABASE_ID" EXPECTED_D1_DATABASE_NAME="$CLOUDFLARE_STAGING_D1_DATABASE_NAME" EXPECTED_WORKER_NAME="$CLOUDFLARE_STAGING_WORKER_NAME" npm run check:bindings
          npx wrangler deploy --dry-run --config dist/monopoly_bank/wrangler.staging.json

      - name: Validate required staging secrets without revealing them
        run: |
          npx wrangler secret list --config dist/monopoly_bank/wrangler.staging.json --format json > staging-secrets.json
          jq -e 'map(.name) as $names | ["RESEND_API_KEY", "RESEND_FROM_EMAIL", "APP_ORIGIN"] | all(. as $required | $names | index($required))' staging-secrets.json
          rm staging-secrets.json

      - name: Rehearse a staging backup restore in isolated local D1
        run: |
          npx wrangler d1 export "$CLOUDFLARE_STAGING_D1_DATABASE_NAME" --remote --output staging-predeploy-backup.sql
          D1_BACKUP_FILE=staging-predeploy-backup.sql npm run test:restore
          rm staging-predeploy-backup.sql

      - name: Apply staging D1 migrations
        run: npx wrangler d1 migrations apply "$CLOUDFLARE_STAGING_D1_DATABASE_NAME" --remote --config dist/monopoly_bank/wrangler.staging.json

      - name: Deploy staging Worker
        run: npx wrangler deploy --config dist/monopoly_bank/wrangler.staging.json

      - name: Post-deploy smoke tests
        run: npm run smoke:deployment
