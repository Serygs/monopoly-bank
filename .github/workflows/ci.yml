name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    name: Deploy development
    needs: quality
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: monopoly-bank-development-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEV_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_DEV_D1_DATABASE_ID }}
      CLOUDFLARE_DEV_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_DEV_D1_DATABASE_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Prepare development Worker configuration
        run: node scripts/prepare-dev-deploy.mjs

      - name: Apply development D1 migrations
        run: npx wrangler d1 migrations apply "$CLOUDFLARE_DEV_D1_DATABASE_NAME" --remote --config dist/monopoly_bank/wrangler.dev.json

      - name: Deploy development Worker
        run: npx wrangler deploy --config dist/monopoly_bank/wrangler.dev.json
