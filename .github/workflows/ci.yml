name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Verify migrations against local D1
        run: npm run test:d1

      - name: Build production assets
        run: npm run build

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    name: Deploy development
    needs: quality
    runs-on: ubuntu-latest
    environment: development
    concurrency:
      group: monopoly-bank-development-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEV_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_DEV_D1_DATABASE_NAME || 'monopoly-bank-dev' }}
    steps:
      - name: Validate Cloudflare credentials
        run: |
          missing=0
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to the GitHub development environment secrets."
            missing=1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID to the GitHub development environment secrets."
            missing=1
          fi
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Resolve development D1 database
        run: |
          database_id="$(npx wrangler d1 info "$CLOUDFLARE_DEV_D1_DATABASE_NAME" --json | jq -er '.. | objects | .uuid? // empty' | head -n 1)"
          test -n "$database_id"
          echo "CLOUDFLARE_DEV_D1_DATABASE_ID=$database_id" >> "$GITHUB_ENV"

      - name: Prepare development Worker configuration
        run: node scripts/prepare-dev-deploy.mjs

      - name: Validate required development email secrets
        run: |
          npx wrangler secret list --config dist/monopoly_bank/wrangler.dev.json --format json > development-secrets.json
          jq -e 'map(.name) as $names | ["RESEND_API_KEY", "RESEND_FROM_EMAIL", "APP_ORIGIN"] | all(. as $required | $names | index($required))' development-secrets.json
          rm development-secrets.json

      - name: Apply development D1 migrations
        run: npx wrangler d1 migrations apply "$CLOUDFLARE_DEV_D1_DATABASE_NAME" --remote --config dist/monopoly_bank/wrangler.dev.json

      - name: Deploy development Worker
        run: npx wrangler deploy --config dist/monopoly_bank/wrangler.dev.json
