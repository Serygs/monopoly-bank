name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production_release:
        description: Deploy the current main revision and apply its pending D1 migrations after production approval.
        required: true
        type: boolean
      production_base_url:
        description: HTTPS custom-domain URL used for post-deploy smoke testing.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_release
    name: Release production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: monopoly-bank-production-release
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SMOKE_BASE_URL: ${{ inputs.production_base_url }}
    steps:
      - name: Validate Cloudflare credentials
        run: |
          missing=0
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to the GitHub production environment secrets."
            missing=1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID to the GitHub production environment secrets."
            missing=1
          fi
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: |
          npm test
          npm run test:d1

      - name: Build production assets
        run: npm run build

      - name: Validate production bindings before migration
        run: |
          WRANGLER_CONFIG_PATH=dist/monopoly_bank/wrangler.json EXPECTED_D1_DATABASE_ID="d9a99c5e-be1d-4112-a8e1-cba4b910a77d" EXPECTED_D1_DATABASE_NAME=monopoly-bank EXPECTED_WORKER_NAME=monopoly-bank npm run check:bindings
          npx wrangler deploy --dry-run

      - name: Validate required production email secrets
        run: |
          npx wrangler secret list --format json > production-secrets.json
          jq -e 'map(.name) as $names | ["RESEND_API_KEY", "RESEND_FROM_EMAIL", "APP_ORIGIN"] | all(. as $required | $names | index($required))' production-secrets.json
          rm production-secrets.json

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply MONOPOLY_BANK_DB --remote

      - name: Deploy production Worker
        run: npx wrangler deploy

      - name: Post-deploy smoke tests
        run: npm run smoke:deployment
