name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production_release:
        description: Deploy the current main revision and apply its pending D1 migrations.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  release-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_release
    name: Release production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: monopoly-bank-production-release
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare credentials
        run: |
          missing=0
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN to the GitHub production environment secrets."
            missing=1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID to the GitHub production environment secrets."
            missing=1
          fi
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply MONOPOLY_BANK_DB --remote

      - name: Deploy production Worker
        run: npx wrangler deploy
